name: Release, Sync & Build Docker

on:
  push:
    branches: [release]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  bump-sync-and-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_PAT }}

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Bump & Push to Release
        run: |
          npm version patch --include-workspace-root --workspaces -m "chore: release %s [skip ci]"
          git push origin release --follow-tags
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Monorepo Images
        run: |
          IMAGE_OWNER=$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO=$(echo "${{ env.REPO_NAME }}" | tr '[:upper:]' '[:lower:]')

          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          
          export NEXT_PUBLIC_API_URL="/trpc_api"
          
          docker compose -p monorepo -f docker-compose.build.yml build $NEXT_BUILD_ARG
          
          SERVICES="api public_api app dash workstation nginx"

          for svc in $SERVICES; do
            docker tag monorepo-${svc} ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:latest
            docker push ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:latest
          done
      
      - name: Sync version to repo  # Main
        # run: |          
        #   git reset --hard HEAD
        #   git clean -fd               
        #   git fetch origin main          
        #   git checkout main          
        #   git merge release --no-edit
        #   git push origin main
        run: |          
          git reset --hard HEAD
          git clean -fd               
          git fetch origin repo          
          git checkout repo          
          git merge release --no-edit
          git push origin repo