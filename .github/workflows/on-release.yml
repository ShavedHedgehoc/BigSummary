name: Release, Sync & Build Docker

on:
  push:
    branches: [release]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  bump-sync-and-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump & Push to Release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -iqE "^feat"; then
            echo "Обнаружена новая фича! Поднимаем минорную версию (minor)..."
            pnpm version minor --no-git-checks --no-git-tag-version
          else
            echo "Фич не обнаружено. Поднимаем патч (patch)..."
            pnpm version patch --no-git-checks --no-git-tag-version
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          pnpm --filter "./apps/**" --filter "./packages/**" exec npm version $NEW_VERSION --no-git-tag-version
          pnpm install --lockfile-only --ignore-scripts

          git add package.json apps/*/package.json packages/*/package.json pnpm-lock.yaml
          git commit -m "chore: release v$NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin release --follow-tags

      - name: Sync version to repo
        run: |
          git fetch origin repo
          git checkout repo
          git merge release --no-edit -m "chore: sync release v${{ env.NEW_VERSION }} [skip ci]"
          git push origin repo
          git checkout release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Monorepo Images
        run: |
          IMAGE_OWNER=$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO=$(echo "${{ env.REPO_NAME }}" | tr '[:upper:]' '[:lower:]')

          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          export NEXT_PUBLIC_API_URL="/trpc_api"

          docker compose -p monorepo -f docker-compose.build.yml build

          SERVICES="api public_api app dash workstation nginx"

          for svc in $SERVICES; do
            docker tag monorepo-${svc} ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:latest
            docker tag monorepo-${svc} ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:${{ env.NEW_VERSION }}
            docker push ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:latest
            docker push ghcr.io/$IMAGE_OWNER/$IMAGE_REPO/${svc}:${{ env.NEW_VERSION }}
          done
