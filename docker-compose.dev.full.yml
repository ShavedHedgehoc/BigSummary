services:
  postgres:
    container_name: postgres_container
    image: postgres:16.2-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: "summary"
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - summary-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:9.18
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PGADMIN_DEFAULT_EMAIL: "eagle221174@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "1"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - postgres
  api:
    container_name: api_container
    build:
      context: .
      dockerfile: apps/api_v2/Dockerfile
      args:
        - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: "production"
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}      
      MSSQL_DATABASE_URL: sqlserver://${MSSQL_HOST}:${MSSQL_PORT};database=${MSSQL_DB};user=${MSSQL_USERNAME};password=${MSSQL_PASSWORD};trustServerCertificate=true
      PORT: ${API_PORT}      
      KLP_TECHNOLOGIST_CHAT_ID: ${KLP_TECHNOLOGIST_CHAT_ID}
      PSK_TECHNOLOGIST_CHAT_ID: ${PSK_TECHNOLOGIST_CHAT_ID}
      KLP_PACKAGING_CHAT_ID: ${KLP_PACKAGING_CHAT_ID}
      PSK_PACKAGING_CHAT_ID: ${PSK_PACKAGING_CHAT_ID}
      EXPRESS_API_URL: ${EXPRESS_API_URL}
      EXPRESS_API_TOKEN: ${EXPRESS_API_TOKEN}      
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost $$PORT || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - postgres      
  public_api:
    container_name: public_api_container
    build:
      context: .
      dockerfile: apps/public_api_v2/Dockerfile
      args:
        - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}            
      PUBLIC_API_PORT: ${PUBLIC_API_PORT}      
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: always
    ports:
      - ${PUBLIC_API_PORT}:${PUBLIC_API_PORT}
    networks:
      - postgres  
  workstation:
    container_name: workstation_container
    build:
      context: .
      dockerfile: apps/workstation/Dockerfile
      args:
        - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - WORKSTATION_PORT=${WORKSTATION_PORT}
    depends_on:      
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${WORKSTATION_PORT}/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - general    
  nginx:
    container_name: nginx_container
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    environment:
      API_PORT: ${API_PORT}
      WORKSTATION_PORT: ${WORKSTATION_PORT}
    ports:
      - "${WORKSTATION_PORT}:${WORKSTATION_PORT}"
    depends_on:      
      api:
        condition: service_healthy
      workstation:
        condition: service_healthy
    networks:      
      - general      
volumes:
  summary-data:
  pgadmin-data:
networks:
  general:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
  postgres:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1