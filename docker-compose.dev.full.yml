services:
  postgres:
    container_name: postgres_container
    image: postgres:16.2-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: "summary"
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - summary-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:9.18
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PGADMIN_DEFAULT_EMAIL: "eagle221174@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "1"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - postgres
  api:
    container_name: api_container
    build:
      context: .
      dockerfile: apps/api_v2/Dockerfile
      args:
        - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/summary
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "summary"
      PORT: ${API_PORT}
      BOT_TOKEN: ${BOT_TOKEN}
      CHAT_ID: ${CHAT_ID}
      KLP_TECHNOLOGIST_CHAT_ID: ${KLP_TECHNOLOGIST_CHAT_ID}
      PSK_TECHNOLOGIST_CHAT_ID: ${PSK_TECHNOLOGIST_CHAT_ID}
      KLP_PACKAGING_CHAT_ID: ${KLP_PACKAGING_CHAT_ID}
      PSK_PACKAGING_CHAT_ID: ${PSK_PACKAGING_CHAT_ID}
      EXPRESS_API_URL: ${EXPRESS_API_URL}
      EXPRESS_API_TOKEN: ${EXPRESS_API_TOKEN}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_USERNAME: ${MSSQL_USERNAME}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_DB: ${MSSQL_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost $$PORT || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - postgres      
  public_api:
    container_name: public_api_container
    build:
      context: .
      dockerfile: apps/public_api_v2/Dockerfile
      args:
        - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/summary
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "summary"
      PUBLIC_API_PORT: ${PUBLIC_API_PORT}      
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: always
    ports:
      - ${PUBLIC_API_PORT}:${PUBLIC_API_PORT}
    networks:
      - postgres      
volumes:
  summary-data:
  pgadmin-data:
networks:
  postgres:
    driver: bridge
